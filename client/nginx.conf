server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # API and real-time sync go to the Node server.
  location /api/ {
    proxy_pass http://server:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /socket.io/ {
    proxy_pass http://server:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  # The service worker and manifest must always be revalidated so updates roll out.
  location = /sw.js { add_header Cache-Control "no-cache"; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }
  location = /registerSW.js { add_header Cache-Control "no-cache"; }
  location = /index.html { add_header Cache-Control "no-cache"; }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Single-page app: unknown paths serve index.html.
  location / {
    # The app shell must be revalidated too, or an old build can linger after a deploy.
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
